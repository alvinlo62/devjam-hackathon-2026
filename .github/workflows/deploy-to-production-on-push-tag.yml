name: Deploy To Production On Push Tag

on:
  push:
    tags:
      - "v*"

env:
  PROJECT_ID: 
  SERVICE: 
  REPOSITORY: 
  IMAGE: 
  # 部署用的 service account email（例如 hackathon-deployer@YOUR_PROJECT_ID.iam.gserviceaccount.com）。
  # 同一個 SA 兼任 CI 部署身分與 Cloud Run 執行身分，這樣 runtime 讀 Secret Manager 才會用到
  # 有掛 secretmanager.secretAccessor 角色的那個身分，不會落到權限不足的預設 Compute SA 上。
  SERVICE_ACCOUNT: 
  DB_INSTANCE_CONNECTION_NAME: 

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: "read"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get Tag Name & Set env
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV

      - name: Run backend tests
        run: |
          cd backend
          pip install uv
          uv sync
          uv run pytest

      # 用 GCP service account 的 JSON key。GCP 建 service account → 下載金鑰
      # → 貼進 repo Settings → Secrets and variables → Actions → Secrets（scope 在 production environment）
      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }} # !! 比賽當天要重新設定 !!

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set Configure Docker
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Docker Build Image
        run: docker build -f Dockerfile -t asia-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ env.RELEASE_VERSION }} -t asia-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:latest .

      - name: Docker Push Image
        run: docker push asia-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }} --all-tags

      # --min-instances 1 --max-instances 1：整場 demo 固定只有一個
      # instance。data/store.py 是純記憶體，Cloud Run 預設會依流量開多個
      # instance，各自有各自的記憶體——班長在一個 instance 接受插入，
      # 民眾端輪詢打到另一個 instance 會看到舊資料。釘住單一 instance
      # 用零程式碼成本擋掉這個問題，不用因此接 Cloud SQL/Firestore。
      # demo 結束、真的要長期上線時再拿掉，改走 db/ 那條路。
      - name: Deploy To Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image asia-east1-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ env.RELEASE_VERSION }} \
            --region asia-east1 \
            --platform managed \
            --allow-unauthenticated \
            --service-account ${{ env.SERVICE_ACCOUNT }} \
            --min-instances 1 \
            --max-instances 1 \
            --add-cloudsql-instances ${{ env.DB_INSTANCE_CONNECTION_NAME }} \
            --set-secrets GEMINI_API_KEY=GEMINI_API_KEY:latest,CLOUD_SQL_CONFIG=CLOUD_SQL_CONFIG:latest