[project]
name = "hackathon-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-dotenv",
    "google-genai",
    "cloud-sql-python-connector[pg8000]>=1.21.0",
    "sqlalchemy>=2.0.52",
    "anyio>=4.14.2",
    "slowapi>=0.1.10",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
